name: Resolve PR #4 conflict

on:
  push:
    branches:
      - experiment/scrolling-3-month-graph
    paths:
      - .github/workflows/resolve-pr-4-conflict.yml

permissions:
  contents: write

jobs:
  resolve:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/scrolling-3-month-graph
          fetch-depth: 0

      - name: Merge main and remove this one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git merge --no-edit -X ours origin/main
          rm .github/workflows/resolve-pr-4-conflict.yml
          git add -A
          git commit -m "chore: resolve main conflict for dynamic graph"
          git push origin HEAD:experiment/scrolling-3-month-graph
